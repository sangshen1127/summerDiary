      叶脉 #6F8F6A = --c-moss 苔藓绿
  -->
  <rect width="32" height="32" rx="7" fill="#F7F4EC"/>
  <path d="M16 6c5.2 3.4 7.6 8 7.6 13.2 0 1.6-.3 3-.8 4.2-1.4-5-4.4-8.4-8.8-10.2" fill="#A8BFA5"/>
