<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    AI 日记 站点图标。

    ⚠️ 为什么是 SVG 而不是 .ico / .png：
      1. 纯文本、可读可改，不需要二进制编辑工具；
      2. 体积极小（几百字节），不占首屏；
      3. 零外部依赖 —— 项目一贯的取舍（见美术风格文件里"刻意不引外部字体"同理）。

    配色取自「森语时光」设计 Token：
      底色 #F7F4EC = --c-mist 晨雾白
